plugins { id 'com.android.application' }

android {
    namespace 'com.altheria.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.altheria.adventure'
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName '1.2-mobile'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
